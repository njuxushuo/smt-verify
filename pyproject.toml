[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smt-stage-verifier"
version = "0.1.0"
description = "Original-shape SMT verification of distributed tensor stage relations"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.12,<5"]

[project.scripts]
smt-verify = "src.app.cli:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]
